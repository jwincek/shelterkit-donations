name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHPCS Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer lint

  php-compat:
    name: PHP ${{ matrix.php }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        # `php -l` runs once per file via xargs (works on all PHP versions
        # — multi-file `php -l` only became reliable in 8.3). xargs aborts
        # on `php -l`'s exit 255 (parse error) and propagates that as a
        # non-zero exit, which fails the step. Parse-error lines surface
        # on stderr; success lines are discarded.
        run: find starter-shelter.php includes/ -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  unit-tests:
    name: PHP ${{ matrix.php }} Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Pure-function unit suite — no WordPress bootstrap, no database.
      # WP functions the helpers call are stubbed in tests/bootstrap.php.
      - name: Run unit tests
        run: composer test

  integration-tests:
    name: PHP ${{ matrix.php }} Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Ensure MySQL client is available
        run: which mysqladmin || sudo apt-get update && sudo apt-get install -y mysql-client

      # Downloads WP 7.0 core + the wordpress-develop test library via curl
      # (no svn) and creates the test database. WooCommerce is not installed
      # — the code under test is WC-free and the plugin self-guards.
      - name: Install WP test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root "127.0.0.1:3306" 7.0

      - name: Run integration tests
        run: composer test:integration

  wc-tests:
    name: WooCommerce Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      # Pinned for reproducibility; bump alongside the local dev environment.
      WC_VERSION: "10.8.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: mysqli, mbstring, bcmath, intl, gd

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.3-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Ensure MySQL client is available
        run: which mysqladmin || sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Install WP test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root "127.0.0.1:3306" 7.0

      # WooCommerce is installed into the test core's plugins dir; the WC
      # bootstrap (tests/wc/bootstrap.php) auto-discovers it there.
      - name: Install WooCommerce
        run: bash bin/install-woocommerce.sh "$WC_VERSION"

      - name: Run WooCommerce integration tests
        run: composer test:wc

  i18n:
    name: Translation template up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: wp-cli

      # Regenerate the POT and compare against the committed one. make-pot only
      # scans source (no WordPress/DB needed). Volatile header lines
      # (timestamp, generator version, version-derived Project-Id-Version) are
      # ignored — everything else, including string source references, must
      # match, so a code change that adds/moves a translatable string fails the
      # job until languages/starter-shelter.pot is regenerated and committed.
      - name: Regenerate POT
        run: wp i18n make-pot . /tmp/expected.pot --domain=starter-shelter --exclude=tests,vendor,node_modules

      - name: Compare with committed POT
        run: |
          strip() { grep -vE '^"(POT-Creation-Date|X-Generator|Project-Id-Version):' "$1"; }
          if ! diff <( strip languages/starter-shelter.pot ) <( strip /tmp/expected.pot ); then
            echo "::error file=languages/starter-shelter.pot::POT is out of date. Run: wp i18n make-pot . languages/starter-shelter.pot --domain=starter-shelter --exclude=tests,vendor,node_modules — then commit."
            exit 1
          fi
          echo "POT is up to date."
