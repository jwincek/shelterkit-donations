name: Release

# Publishing is driven entirely by pushing a version tag:
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# The tag must match the version in the plugin header — the validate job
# enforces that before anything is published.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuse to publish a tag whose version metadata disagrees with itself.
      # WordPress.org serves whatever `Stable tag` points at, so a mismatch
      # ships the wrong version with no error anywhere.
      - name: Check version consistency
        run: bin/check-versions.sh "${GITHUB_REF_NAME}"

      # Screenshot files pair with readme captions by position, not by name,
      # so a gap fails silently on the listing page. Block the release rather
      # than discover it after publishing.
      - name: Check screenshots match their captions
        run: bin/check-screenshots.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The 'Requires PHP' floor, not the newest available. A standalone
          # true/false/null type is a parse error on 8.1 but silently accepted
          # by every later version, so the floor is the only job that catches
          # code the plugin's own header promises will run.
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # A tag should never ship code that fails the same gates as main.
      - name: PHP CodeSniffer
        run: composer lint

      - name: PHPUnit
        run: composer test

  release:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    # Evaluated at job level so the deploy step's `if` can read it reliably.
    env:
      HAS_SVN_CREDENTIALS: ${{ secrets.SVN_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      # Git tags are v-prefixed (v2.1.0) but WordPress.org versions are not.
      # The deploy action below defaults VERSION to the raw tag name, which
      # would create SVN tags/v2.1.0 while `Stable tag: 2.1.0` points at
      # tags/2.1.0 — a mismatch that silently serves nothing. Strip the
      # prefix once here and use it for both the zip and the SVN tag.
      - name: Resolve plugin version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Build the runtime-only package. bin/build-dist.sh reads .distignore and
      # runs its leak guard, so this zip contains exactly what the
      # WordPress.org deploy publishes — and fails the release if it does not.
      - name: Build distribution package
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bin/build-dist.sh build
          cd build && zip -rq "shelterkit-donations-${PLUGIN_VERSION}.zip" shelterkit-donations

      # Deploy to the WordPress.org SVN repository: commits the built files to
      # trunk/ and tags/<version>/, and syncs .wordpress-org/ to assets/ —
      # which is a sibling of trunk/, not a directory inside it.
      #
      # Skipped automatically until the SVN_USERNAME / SVN_PASSWORD repository
      # secrets exist, so this workflow is safe to merge before the plugin is
      # approved — tagging will still build and attach the zip below.
      - name: Deploy to WordPress.org
        if: env.HAS_SVN_CREDENTIALS == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: shelterkit-donations
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: ./build/shelterkit-donations
          # Without this the SVN tag would be the raw, v-prefixed git tag.
          VERSION: ${{ steps.ver.outputs.version }}

      # Attach the installable zip to the GitHub Release. The auto-generated
      # "Source code" archive is the whole repo and is not installable, so this
      # gives anyone installing from GitHub a working package.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${PLUGIN_VERSION}" \
            --notes "See CHANGELOG.md for details." \
            "build/shelterkit-donations-${PLUGIN_VERSION}.zip" \
            || gh release upload "${GITHUB_REF_NAME}" \
                 "build/shelterkit-donations-${PLUGIN_VERSION}.zip" --clobber
